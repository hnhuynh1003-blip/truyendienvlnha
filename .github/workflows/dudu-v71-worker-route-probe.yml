name: DUDU V71 Worker route diagnostic (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'js/dudu-system-client-v71.js'
      - 'cloudflare/src/dudu-system-api-v71.mjs'
      - 'cloudflare/wrangler.npc-ai-v54.toml'
      - '.github/workflows/dudu-v71-worker-route-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read public health and unauthenticated System route (NO writes or secrets)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          endpoint='https://dudu-ai-staging.dudu-studio-ai.workers.dev'
          def probe(path):
              request=urllib.request.Request(endpoint+path,headers={
                  'Origin':'https://hnhuynh1003-blip.github.io',
                  'User-Agent':'DUDU-V71-ReadOnly-Route-Check/1.0'
              },method='GET')
              try:
                  with urllib.request.urlopen(request,timeout=18) as r:
                      status=r.status
                      body=r.read(2048)
                      cors=r.headers.get('Access-Control-Allow-Origin','')
              except urllib.error.HTTPError as e:
                  status=e.code
                  body=e.read(2048)
                  cors=e.headers.get('Access-Control-Allow-Origin','')
              except Exception as e:
                  print(path,'NETWORK_UNAVAILABLE',type(e).__name__)
                  return
              try: code=json.loads(body).get('error',{}).get('code','')
              except (ValueError,AttributeError): code=''
              print(path,'HTTP',status,'error_code',code,'cors_origin',
                    'OK' if cors=='https://hnhuynh1003-blip.github.io' else 'MISSING_OR_WRONG')
              if path=='/v1/system/me':
                  if status==401:print('V71_ROUTE_PRESENT: authenticated UID still required')
                  elif status==503:print('V71_ROUTE_PRESENT_BUT_REGISTRY_NOT_CONFIGURED')
                  elif status==404:print('V71_ROUTE_ABSENT: deployed Worker has not been updated to V71')
                  else:print('V71_ROUTE_REQUIRES_REVIEW')
          probe('/health')
          probe('/v1/system/me')
          print('READ ONLY: no JWT, no user data, no registry writes, no Cloudflare deployment')
          PY

      - name: Check which Cloudflare Worker secret binding is missing (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'PREFLIGHT: GitHub Cloudflare credentials unavailable; did not read remote bindings'
            exit 0
          fi
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/dudu-ai-staging/settings" \
            > "$RUNNER_TEMP/dudu-v71-safe-settings.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          filename=Path(os.environ['RUNNER_TEMP'])/'dudu-v71-safe-settings.json'
          payload=json.loads(filename.read_text())
          if not payload.get('success') or not isinstance(payload.get('result',{}).get('bindings'),list):
              raise SystemExit('PREFLIGHT: cannot inspect current Worker bindings')
          names={x.get('name') for x in payload['result']['bindings']
                 if x.get('type')=='secret_text'}
          missing=[key for key in ('GEMINI_API_KEY','DUDU_SYSTEM_PILOT_UID')
                   if key not in names]
          if missing:
              for key in missing:
                  print('PREFLIGHT_MISSING_CLOUDFLARE_SECRET: '+key)
              print('Deployment must stay blocked until the missing secret binding(s) are configured.')
          else:
              print('PREFLIGHT_PASS: both required Cloudflare Worker secret binding names exist.')
          print('Read-only audit complete; no secret values, UIDs or tokens printed.')
          PY

      - uses: actions/checkout@v7
      - name: Diagnose named differences between deployed Worker and main (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 0
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/dudu-ai-staging/settings" \
            > "$RUNNER_TEMP/dudu-v71-compare.json"
          python3 - <<'PY'
          import json,os,tomllib
          from pathlib import Path
          response=json.loads((Path(os.environ['RUNNER_TEMP'])/'dudu-v71-compare.json').read_text())
          assert response.get('success') and isinstance(response.get('result',{}).get('bindings'),list)
          live={x['name']:str(x.get('text','')) for x in response['result']['bindings']
                if x.get('type')=='plain_text'}
          with open('cloudflare/wrangler.npc-ai-v54.toml','rb') as f:
              cfg=tomllib.load(f)
          intended={k:str(v) for k,v in cfg['vars'].items()}
          for key in sorted(set(live)&set(intended)):
              if live[key]!=intended[key]:
                  print('V71_VAR_VALUE_MISMATCH_NAME: '+key)
          for key in sorted(set(intended)-set(live)):
              print('V71_VAR_ABSENT_FROM_LIVE_NAME: '+key)
          for key in sorted(set(live)-set(intended)):
              print('V71_VAR_ONLY_ON_LIVE_NAME: '+key)
          print('Read-only variable diff complete: names only; no values, tokens or UIDs printed.')
          PY
