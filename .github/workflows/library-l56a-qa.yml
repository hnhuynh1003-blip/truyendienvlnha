name: DUDU Library L5.6A QA (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'js/reader-name-*.js'
      - 'js/reader-terms-l56b.js'
      - 'js/reader-names-l5*.js'
      - 'js/library-*.js'
      - 'js/epub-*.js'
      - 'css/reader-names-l5*.css'
      - 'css/library-*.css'
      - 'index.html'
      - 'tests/reader-name-*.test.cjs'
      - 'tests/library-epub-storage-l6p1.test.cjs'
      - 'tests/library-epub-r2-manifest-l6p2a.test.cjs'
      - 'tests/reader-terms-l56b.test.cjs'
      - 'tests/reader-names-l5*.test.cjs'
      - 'tests/browser-reader-*.cjs'
      - 'tests/browser-reader-terms-l56b.cjs'
      - 'tests/browser-library-*.cjs'
      - '.github/workflows/library-l56a-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/reader-name-*.js'
      - 'js/reader-terms-l56b.js'
      - 'js/reader-names-l5*.js'
      - 'js/library-*.js'
      - 'js/epub-*.js'
      - 'css/reader-names-l5*.css'
      - 'css/library-*.css'
      - 'index.html'
      - 'tests/reader-name-*.test.cjs'
      - 'tests/library-epub-storage-l6p1.test.cjs'
      - 'tests/library-epub-r2-manifest-l6p2a.test.cjs'
      - 'tests/reader-names-l5*.test.cjs'
      - 'tests/browser-reader-*.cjs'
      - 'tests/browser-library-*.cjs'
      - '.github/workflows/library-l56a-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-l56a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and chapter-name regressions
        run: |
          node --check js/reader-name-scan-l56a.js
          node --check js/reader-name-lookup-l55.js
          node --check js/reader-name-lookup-worker-l55.js
          node --check js/reader-names-l54.js
          node --check js/reader-name-ui-l54.js
          node --check js/reader-terms-l56b.js
          node --check js/library-epub-storage-l6p1.js
          node --check js/library-epub-r2-manifest-l6p2a.js
          node --test tests/reader-name-scan-l56a.test.cjs tests/reader-name-lookup-l55.test.cjs tests/reader-names-l53.test.cjs tests/reader-names-l54.test.cjs tests/reader-terms-l56b.test.cjs tests/library-epub-storage-l6p1.test.cjs tests/library-epub-r2-manifest-l6p2a.test.cjs
      - name: Install Playwright Chromium (test only)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Read, return and EPUB catalog browser regressions
        run: |
          node tests/browser-library-reading-return-c443.cjs
          node tests/browser-library-catalog-l2e.cjs
          node tests/browser-library-smart-filter-l3.cjs
          node tests/browser-library-finish-l4.cjs
          node tests/browser-library-capacity-r1.cjs
      - name: Names L5.3 - L5.6A and mobile reader interactions
        run: |
          node tests/browser-reader-names-l53.cjs
          node tests/browser-reader-names-l54.cjs
          node tests/browser-reader-name-lookup-l55.cjs
          node tests/browser-reader-terms-l56b.cjs
