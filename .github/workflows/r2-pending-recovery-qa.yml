name: R2 pending recovery read-only QA
on:
  push:
    branches: [fix/r2-pending-recovery-clarity-20261122]
  pull_request:
    branches: [main]
    paths:
      - 'js/library-r2-author-ui-c13b6d.js'
      - 'tests/r2-pending-recovery-r1.test.cjs'
      - 'docs/r2-pending-recovery/FIREBASE_HANDOFF.md'
      - '.github/workflows/r2-pending-recovery-qa.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/library-r2-author-ui-c13b6d.js
      - run: node --test tests/r2-pending-recovery-r1.test.cjs tests/r2-published-preflight-r1.test.cjs
