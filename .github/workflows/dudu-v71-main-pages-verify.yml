name: DUDU V71 Published Main - read-only verification
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-main-pages:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published main HTML, JS and CSS without credentials or writes
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          base='https://hnhuynh1003-blip.github.io/truyendienvlnha/'
          paths=(
              ('', 'js/dudu-system-app-v69.js?v=71-main-3'),
              ('js/dudu-system-app-v69.js?v=71-main-3', 'dudu-v71-unavailable'),
              ('js/dudu-system-client-v71.js?v=71-2', 'DuduSystemClientV71'),
              ('css/dudu-system-app-v69.css?v=71-visual-3', 'dudu-v71'),
          )
          def read(url):
              request=urllib.request.Request(url,headers={
                  'Cache-Control':'no-cache',
                  'User-Agent':'DUDU-Main-Pages-ReadOnly/1.0'
              })
              with urllib.request.urlopen(request,timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}: {url}')
                  return response.read().decode('utf-8')

          last=None
          for attempt in range(10):
              try:
                  for path,needle in paths:
                      body=read(base+path)
                      if needle not in body:
                          raise AssertionError(f'missing published marker in {path or "index.html"}')
                  print('PASS: production Pages main HTML, System UI, client and CSS are published')
                  print('READ-ONLY: no Firebase login, Worker call, passport issuance, reward or user write')
                  break
              except Exception as error:
                  last=error
                  print(f'Published main not yet consistent (attempt {attempt+1}/10): {error}')
                  if attempt==9:
                      raise SystemExit(f'FAIL: published main artifacts out of sync: {last}')
                  time.sleep(6)
          PY
