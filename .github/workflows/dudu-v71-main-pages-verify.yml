name: DUDU Published Main - core and FUN read-only verification
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-main-pages:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published main HTML, JS and CSS without credentials or writes
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          base='https://hnhuynh1003-blip.github.io/truyendienvlnha/'
          paths=(
              ('', 'js/vanbao-lobby-final-f44.js?v=final-1'),
              ('js/features-t0.js?v=t0-1', 'const worlds=false'),
              ('js/cultivation-t0.js?v=final-1', 'DuduCultivationT0'),
              ('js/vanbao-rewards-f44.js?v=f44-1', 'DuduVanBaoRewardsF44'),
              ('js/vanbao-sessions-f44.js?v=final-1', 'DuduVanBaoSessionsF44'),
              ('js/vanbao-duel-worker-f44.js', 'self.onmessage'),
              ('css/vanbao-final-f44.css?v=final-1', '.f44-nav'),
              ('docs/DUDU_F44_ART_MANIFEST.csv', 'f44-card-plain'),
          )
          def read(url):
              request=urllib.request.Request(url,headers={
                  'Cache-Control':'no-cache',
                  'User-Agent':'DUDU-Main-Pages-ReadOnly/1.0'
              })
              with urllib.request.urlopen(request,timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f'HTTP {response.status}: {url}')
                  return response.read().decode('utf-8')

          last=None
          for attempt in range(10):
              try:
                  for path,needle in paths:
                      body=read(base+path)
                      if needle not in body:
                          raise AssertionError(f'missing published marker in {path or "index.html"}')
                  print('PASS: production Pages main HTML, T0 flags, FUN rewards and Art manifest are published')
                  print('READ-ONLY: no Firebase login, Worker call, passport issuance, reward or user write')
                  break
              except Exception as error:
                  last=error
                  print(f'Published main not yet consistent (attempt {attempt+1}/10): {error}')
                  if attempt==9:
                      raise SystemExit(f'FAIL: published main artifacts out of sync: {last}')
                  time.sleep(6)
          PY
