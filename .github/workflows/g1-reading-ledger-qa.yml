name: G1 Verified Reading Ledger QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/src/verified-reading-ledger-g1.mjs'
      - 'cloudflare/tests/verified-reading-ledger-g1.test.mjs'
      - 'docs/G1_VERIFIED_READING_EVIDENCE_FRESH_START_PREFLIGHT_2026-11-24.md'
      - '.github/workflows/g1-reading-ledger-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence:
    name: Isolated signed evidence and dedupe tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify private source syntax
        run: node --check cloudflare/src/verified-reading-ledger-g1.mjs
      - name: Verify HMAC evidence + multi-device + fresh-start receipts (no network)
        run: node --test cloudflare/tests/verified-reading-ledger-g1.test.mjs
