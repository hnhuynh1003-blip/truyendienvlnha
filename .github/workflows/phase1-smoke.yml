name: DUDU Phase 1 Smoke
on:
  pull_request:
    branches: [fixapp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript, scope, Gemini gateway and quota guards
        run: |
          node --test tests/*.test.cjs
          node --test functions/tests/*.test.cjs
          node --check functions/index.js
          node --check js/ai-proxy.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Verify chapter editor and sandbox isolation in Chromium
        run: |
          node tests/browser-smoke.cjs
          node tests/browser-auth-private.cjs
