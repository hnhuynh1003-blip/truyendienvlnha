name: DUDU Phase 1 Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fixapp, feat/identity-npc-editor-v2, feat/dudu-v24-verified-milestones, feat/dudu-v25-trusted-milestone-ledger, feat/dudu-v26-verified-producers, feat/dudu-v27-phone-sandbox-ux-r1, feat/dudu-v27-phone-sandbox-ux-r2, feat/dudu-v27-phone-sandbox-ux-r3, feat/dudu-v27-phone-wallpaper-avatar-audit-r4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify JavaScript, scope, Gemini gateway and quota guards
        run: |
          node --test tests/*.test.cjs
          node --test tests/dudu-transmigration-v69.test.cjs
          node --test tests/dudu-messenger-v67-2.cjs
          node --test tests/dudu-steward-v67-3.cjs
          node --test functions/tests/*.test.cjs
          node --check functions/index.js
          node --check js/ai-proxy.js
          node --check js/collectibles-client.js
          node --check cloudflare/src/collectible-rules.mjs
          node --check cloudflare/src/collectibles.mjs
          node --check cloudflare/src/index.mjs
          node --check cloudflare/src/auth.mjs
          node --check cloudflare/src/quota.mjs
      - name: Parse V52 manual Firebase deploy script (never execute)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/deploy-economy-v52.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Test and bundle Cloudflare Worker without deploying
        run: |
          npm install --prefix cloudflare --no-audit --no-fund
          npm test --prefix cloudflare
          npm run build --prefix cloudflare
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: V71 main production-mode browser acceptance (no Sandbox, no external writes)
        run: |
          node tests/browser-main-system-v71.cjs
          node tests/browser-auth-private.cjs
      - name: Legacy Sandbox regression (advisory; cannot block main V71)
        continue-on-error: true
        run: |
          node tests/browser-smoke.cjs
          node --test tests/browser-sandbox-discussion.cjs
          node --test tests/browser-epub-import-v48.cjs
