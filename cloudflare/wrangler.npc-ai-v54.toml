name = "dudu-ai-staging"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
PROJECT_ID = "truyendienvl"
ALLOWED_ORIGIN = "https://hnhuynh1003-blip.github.io"
# V54 manual NPC AI activation; requires valid Worker GEMINI_API_KEY Secret.
AI_ENABLED = "true"
COLLECTIBLES_ENABLED = "false"
COLLECTIBLE_SELF_CLAIM_ENABLED = "false"
PLAYER_AVATAR_SYNC_ENABLED = "false"
AVATAR_AWARDS_ENABLED = "false"
AVATAR_AWARD_ISSUER_ENABLED = "false"
AVATAR_R2_ENABLED = "false"
COMMENTS_ENABLED = "false"
GIFTS_ENABLED = "false"
GIFT_SETTLEMENT_ENABLED = "false"
# V45 pilot remains OFF. UID secrets and an explicit v45-* namespace are
# required separately; never enter real Firebase UIDs in this public repo.
PILOT_ENABLED = "false"
# A second settlement-specific kill switch. Do NOT enable without server
# provenance, cross-DO outbox/saga and independent pilot audit.
PILOT_SETTLEMENT_ENABLED = "false"
MODEL = "gemini-3.5-flash-lite"
# V58 Free opt-in approved by project owner on 2026-10-19 for AU and reader.
# Cloudflare Workers Free enforces 10,000 Neurons/day. Never enable Paid.
DUDU_AI_FREE_ONLY = "true"
DUDU_WORKERS_AI_APPROVED = "true"
DUDU_WORKERS_ACCOUNT_FREE_VERIFIED = "true"
DUDU_AI_FALLBACK_ENABLED = "true"
DUDU_PAID_PROVIDERS_ENABLED = "false"
# V68 never inherits NPC AI enablement. Hive paid pilot is disabled.
DUDU_HIVE_ENABLED = "false"
DUDU_HIVE_TEST_APPROVED = "false"
# V71 genuine server-side system identities. No browser/Sandbox fake state.
DUDU_SYSTEM_LIVE_ENABLED = "true"
# Test issuance still requires Firebase admin AND DUDU_SYSTEM_PILOT_UID Secret.
DUDU_SYSTEM_PILOT_CARD_ENABLED = "true"

# AI binding may run only after Firebase auth, DO quota, and Free flags.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "DUDU_QUOTA"
class_name = "DuduQuota"

[[durable_objects.bindings]]
name = "DUDU_COLLECTIBLES"
class_name = "DuduCollectibles"

[[migrations]]
tag = "v1-sqlite"
new_sqlite_classes = ["DuduQuota"]

[[migrations]]
tag = "v2-collectibles-sqlite"
new_sqlite_classes = ["DuduCollectibles"]

[[durable_objects.bindings]]
name = "DUDU_PLAYER_APPEARANCE"
class_name = "DuduPlayerAppearance"

[[migrations]]
tag = "v3-player-appearance-sqlite"
new_sqlite_classes = ["DuduPlayerAppearance"]

[[durable_objects.bindings]]
name = "DUDU_DISCUSSION"
class_name = "DuduDiscussion"

[[migrations]]
tag = "v4-comments-sqlite"
new_sqlite_classes = ["DuduDiscussion"]

[[durable_objects.bindings]]
name = "DUDU_GIFT_LEDGER"
class_name = "DuduGiftLedger"

[[migrations]]
tag = "v5-gift-ledger-sqlite"
new_sqlite_classes = ["DuduGiftLedger"]

[[durable_objects.bindings]]
name = "DUDU_SYSTEM_REGISTRY"
class_name = "DuduSystemRegistry"

[[migrations]]
tag = "v6-dudu-system-registry-sqlite"
new_sqlite_classes = ["DuduSystemRegistry"]
