<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUDU — Thử bộ tra tên</title>
<link rel="stylesheet" href="../css/reader-names-l53.css?v=l5-3b"><link rel="stylesheet" href="../css/reader-names-l54.css?v=l5-4-1"><link rel="stylesheet" href="../css/reader-name-lookup-l55.css?v=l55-1">
<style>
*{box-sizing:border-box}body{margin:0;background:#111e2a;color:#e0e9f0;font:16px/1.7 system-ui,sans-serif}.preview-head{max-width:760px;margin:auto;padding:28px 22px 18px;border-bottom:1px solid #41627155}.preview-head small{color:#88bbca;letter-spacing:.12em;font-size:11px}.preview-head h1{font-size:25px;line-height:1.4;margin:5px 0 12px}.preview-actions{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid #6f9fad;background:#dcebf2;color:#294e62;border-radius:9px;padding:9px 12px;font:600 13px/1.4 system-ui;cursor:pointer;min-height:40px}.preview-head p{color:#9fb6c4;font-size:13px}.preview-head details{margin:15px 0}.preview-head textarea{display:block;margin:8px 0;width:100%;min-height:180px;border:1px solid #5d8495;border-radius:10px;background:#192d3b;color:#e7f2f8;font:15px/1.6 system-ui;padding:12px}.preview-head summary{cursor:pointer;color:#afd0dc;font-size:13px}#reader-content{max-width:760px;margin:auto;padding:20px 22px 150px;font:20px/1.95 Georgia,serif}#reader-content p{margin:0 0 1.4em}#reader-settings-popover{position:fixed;left:12px;bottom:12px;z-index:100;background:#223b49e8;border-radius:12px;padding:9px;box-shadow:0 8px 24px #0006}#reader-settings-popover .l54-tools{border:0;margin:0;padding:0}.preview-badge{font-size:11px;color:#94bccb;margin-top:10px}@media(max-width:600px){.preview-head{padding:18px 16px 12px}.preview-head h1{font-size:21px}#reader-content{padding:18px 17px 150px;font-size:20px}}
</style>
<script src="../js/reader-name-dictionary-l53.js?v=l5-3b"></script><script src="../js/reader-name-lookup-l55.js?v=l55-1"></script><script src="../js/reader-names-l54.js?v=l55-1"></script><script src="../js/reader-name-ui-l54.js?v=l55-1"></script>
</head><body>
<div class="preview-head"><small>DUDU LIBRARY · BẢN THỬ RIÊNG</small><h1>Tra tên, chọn gợi ý, tiếp tục đọc</h1>
<div class="preview-actions"><select id="preview-type" aria-label="Loại truyện"><option value="epub">EPUB</option><option value="web">Web</option></select><button type="button" id="preview-sample">Nạp đoạn mẫu</button><button type="button" onclick="DuduReaderNamesL53.scan()">Dò tên</button><button type="button" onclick="DuduReaderNamesL53.openManager()">Từ điển / bộ tra</button></div>
<p>Thử “lộc biết thuyền”, “tần rõ ràng”. Dùng Sửa tên ở góc dưới để chạm từng từ, rồi chọn cả cụm.</p>
<details><summary>Dán một đoạn truyện của bạn để thử</summary><textarea id="preview-source" aria-label="Đoạn truyện thử"></textarea><button type="button" id="preview-render">Đọc đoạn này</button></details>
<div class="preview-badge">Lần tra đầu tải bộ dữ liệu khoảng 7,5 MB. Không gọi AI hay API dịch trả phí.</div>
</div>
<div id="reader-view" style="display:block"><div id="reader-settings-popover"></div><article id="reader-paper"><div id="reader-content"></div></article><button id="reader-name-open-l53" hidden>Tên riêng</button><div id="reader-name-hint-l53" hidden></div><div id="reader-name-modal-l53" class="reader-name-overlay-l53" role="dialog" aria-modal="true" aria-labelledby="reader-name-title-l53" hidden></div></div>
<script>
'use strict';
const example=['Lộc biết thuyền nói: “Hôm nay chúng ta thử đi theo con đường ven suối.”','Người bên cạnh quay lại. lộc biết thuyền hỏi: “Ngươi đã chuẩn bị xong chưa?”','Gió thổi qua rừng trúc. lộc biết thuyền cười, rồi chậm rãi bước tới.','Tần rõ ràng đứng dưới mái hiên. tần rõ ràng nói rằng mọi người có thể nghỉ chân ở đây.','Ôn nếu hỏi về người dẫn đường. Cách gọi này cần kiểm tra, không tự coi một ứng viên là tên gốc.','Tần Mặc Hàm gật đầu. Mặc Hàm bước qua cây cầu, vẫn giữ cách xưng hô rút gọn trong câu.'].join('\n\n');
function renderPreview(){const paragraphs=document.getElementById('preview-source').value.split(/\n+/u).filter(s=>s.trim()),id=document.getElementById('preview-type').value+':l55-private-preview';DuduReaderNamesL53.setStory(id);DuduReaderNamesL53.prepareChapter(paragraphs);const host=document.getElementById('reader-content');host.replaceChildren();for(const text of paragraphs){const p=document.createElement('p');DuduReaderNamesL53.bindParagraph(p,text);host.append(p);}}
document.getElementById('preview-source').value=example;document.getElementById('preview-sample').addEventListener('click',()=>{document.getElementById('preview-source').value=example;renderPreview();});document.getElementById('preview-render').addEventListener('click',renderPreview);document.getElementById('preview-type').addEventListener('change',renderPreview);renderPreview();
</script></body></html>
