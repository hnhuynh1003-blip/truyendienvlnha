<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Phó Bản Thăm Dò</title><link rel="stylesheet" href="r3e.css?art=r54-topbar-4"></head><body>
<main id="app" data-dudu-exploration-r3e><div id="stage" class="r3e-stage" data-scene="portal" data-mode="MOCK_ONLY">
 <img id="background" class="r3e-background" src="../../../assets/tu-tien/exploration-r3e/backgrounds/portal_clean.webp" alt=""><div class="r3e-shade" aria-hidden="true"></div>
<section id="profile-card" class="r3e-player-hud" aria-label="Hồ sơ Tu Tiên"><img class="r4-hud-art" src="../../../assets/tu-tien/exploration-r54/hud/hud_ice_glass_blank.svg" alt=""><img class="r3e-hud-cloud" src="../../../assets/tu-tien/vis-t2/web/qiankun-jade-cloud-ornament.webp" alt=""><div class="r3e-portrait-group"><button id="profile-avatar" type="button" aria-haspopup="dialog" aria-label="Đổi avatar tài khoản"></button></div><div class="r3e-profile-main"><div class="r3e-profile-heading"><strong id="profile-name"></strong><small id="profile-level"></small><span class="r3e-profile-power"><svg class="r3e-power-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 2 6 0 0 6-12 12-6-6Z M3 13l8 8 M2 22l4-4"/></svg> <span>Lực Chiến</span> <output id="combat-power">—</output></span></div><div class="r3e-profile-bars"><div id="hp-hud"><div class="r3e-profile-label"><span><img src="../../../assets/tu-tien/exploration-r3e/ui/heart_icon.svg" alt="">Sinh Lực</span> <output id="hp"></output></div><div class="r3e-profile-track"><i id="hpbar"></i></div></div><div id="stamina-hud"><div class="r3e-profile-label"><span><img src="../../../assets/tu-tien/exploration-r3e/ui/stamina_icon.svg" alt="">Thể Lực</span> <output id="stamina"></output></div><div class="r3e-profile-track"><i id="staminabar"></i></div></div></div><small id="profile-recovery"></small></div></section>
<div class="r3e-play-region"><section id="lobby" class="r3e-screen" aria-label="Cổng Thăm Dò"><div class="r3e-portal-visual"><img id="portal-swirl" src="../../../assets/tu-tien/exploration-r3e/vfx/portal_swirl_overlay.png" alt=""></div></section>
<section id="result-screen" aria-label="Kết quả thăm dò" hidden><div class="r3e-result-card"><div id="result-paint" class="r3e-result-paint"><img id="result-image" alt=""></div><h1 class="r54-result-eyebrow">Kết quả thăm dò</h1><h2 id="result-name"></h2><p id="result-description"></p></div><div class="r3e-result-actions"><button id="result-back" class="r3e-art-action"><img src="../../../assets/tu-tien/exploration-r54/buttons/retreat_blank.svg" alt=""><span>Rút lui</span></button><button id="result-enter" class="r3e-art-action"><img src="../../../assets/tu-tien/exploration-r54/buttons/enter_blank.svg" alt=""><span>Tiến vào</span><small id="result-cost" hidden></small></button></div></section>
<p id="summary" class="r3e-sr-only" role="status"></p>
<section id="scene" class="r3e-area" aria-label="Thu thập" hidden><div class="r3e-object-region"><img id="object" class="r3e-collectible" alt="Đối tượng thu thập"></div><section id="control-panel" class="r3e-mechanic-panel" aria-label="Bảng tương tác"><p id="clue"></p><div class="r3e-mechanic-controls"><div id="cracks" aria-label="Chọn điểm nứt" hidden><button data-point="0"><span>Mảnh</span></button><button data-point="1"><span>Liền</span></button><button data-point="2"><span>Sâu</span></button></div><label id="force-wrap">Điều chỉnh lực <output id="force-value">55</output><input id="force" type="range" min="0" max="100" value="55" aria-label="Điều chỉnh lực"></label><div id="grid" aria-label="Lưới thăm dò 3 × 3" hidden></div><div id="timing-wrap"><div id="timing" class="r3e-pulse" role="meter" aria-label="Nhịp linh khí" aria-valuemin="0" aria-valuemax="100"><img src="../../../assets/tu-tien/exploration-r3e/ui/pulse_ring.svg" alt=""><i id="pointer"></i><button id="timing-tap" aria-label="Chạm canh nhịp"><span>Chạm nhịp</span></button></div></div></div><p id="cost-hint" hidden></p></section><img id="vfx" alt="" hidden><span id="vfx-label" class="r3e-sr-only" role="status"></span></section>
</div>
 <nav id="footer" aria-label="Điều hướng phó bản"><button id="retreat" class="r3e-round-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="journal" aria-label="Trở về"><img class="r3e-round-frame" src="../../../assets/tu-tien/exploration-r3e/ui/ring_button_blank.svg" alt=""><img class="r3e-round-icon" src="../../../assets/tu-tien/exploration-r3e/ui/retreat_icon.svg" alt=""><span class="r54-journal-label">Nhật ký</span></button><button id="action" class="r3e-main-button"><img src="../../../assets/tu-tien/exploration-r3e/ui/action_blank.svg" alt=""><span id="action-label">Thăm dò</span><small id="search-note" aria-live="polite"></small></button><button id="bag" class="r3e-round-button" aria-label="Túi đồ"><img class="r3e-round-frame" src="../../../assets/tu-tien/exploration-r3e/ui/ring_button_blank.svg" alt=""><img class="r3e-round-icon" src="../../../assets/tu-tien/exploration-r3e/ui/bag_icon.svg" alt=""></button></nav>
 <dialog id="journal" aria-modal="true" aria-labelledby="journal-title" hidden><button id="journal-close" aria-label="Đóng nhật ký">×</button><h2 id="journal-title">Nhật ký thăm dò</h2><p id="journal-content"></p></dialog><p id="feedback" role="status" hidden></p>
 <button id="injury" class="r3e-injury" hidden aria-controls="injury-detail" aria-expanded="false"><img id="injury-icon" alt=""><span id="injury-label"></span></button>
 <aside id="injury-detail" hidden role="dialog" aria-label="Nội Thương"><button id="injury-close" aria-label="Đóng nội thương">×</button><b id="injury-title"></b><p>Trạng thái thử nghiệm. Chưa tích hợp dưỡng thương.</p></aside>
</div>

<details id="demo-tools" hidden><summary id="demo-label">Mô phỏng</summary><label>Đồng hồ kiểm chứng<select id="demo-clock"><option value="live">Nhịp chuyển động</option><option value="hit">Cố định: đúng nhịp</option><option value="miss">Cố định: sai nhịp</option></select></label><button id="demo-reset">Lượt demo mới</button><p>Chỉ bộ nhớ demo; không sửa save hiện có.</p></details>
</main><script type="module" src="collection.mjs?r3e=1"></script></body></html>
